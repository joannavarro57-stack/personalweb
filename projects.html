<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Selected Projects | Bready Web Studios</title>
<meta name="description" content="Selected projects from Bready Web Studios: Always Bready, Polybelle, Arbab Kebab, Feby's, Reece Music and Big Motors Co..">
<meta name="theme-color" content="#1b2b52">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231b2b52'/%3E%3Ctext x='32' y='42' font-family='Arial,sans-serif' font-weight='800' font-size='28' text-anchor='middle' fill='%23e2b45a'%3EJN%3C/text%3E%3C/svg%3E">
<style>*,*::before,*::after{box-sizing:border-box}html{color-scheme:light dark}body{margin:0;-webkit-font-smoothing:antialiased}img{max-width:100%}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#f6f7fb;--surface:#fff;--ink:#14203a;--muted:#56607a;--line:#d9deea;
  --navy:#1b2b52;--accent:#902bb8;--chip:#eef1f8;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",sans-serif;
  --body:"Newsreader",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1526;--surface:#151f36;--ink:#e8ecf5;--muted:#9aa5bf;--line:#27334f;
  --navy:#9fb4e8;--accent:#e2b45a;--chip:#1c2742;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1526;--surface:#151f36;--ink:#e8ecf5;--muted:#9aa5bf;--line:#27334f;
  --navy:#9fb4e8;--accent:#e2b45a;--chip:#1c2742;color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:19px;line-height:1.6}
a{color:var(--navy);text-underline-offset:3px}
a:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:3px}
.wrap{max-width:1120px;margin:0 auto;padding:28px 20px 64px}
.topnav{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;font:500 13px var(--mono);letter-spacing:.06em;text-transform:uppercase}
.topnav a{color:var(--muted);text-decoration:none}
.topnav a:hover{color:var(--ink)}
.brand{font:800 18px var(--display)!important;letter-spacing:0;text-transform:none}
.brand span{color:var(--accent)}
.hero{padding:72px 0 38px;border-bottom:1px solid var(--line)}
.eyebrow,.label{font:500 12px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
h1,h2,h3{font-family:var(--display);line-height:1.08;text-wrap:balance}
h1{max-width:800px;margin:12px 0 18px;font-size:clamp(42px,7vw,76px);font-weight:800;letter-spacing:-.04em}
h1 em{font-style:normal;color:var(--accent)}
.lede{max-width:56ch;margin:0;color:var(--muted);font-size:clamp(19px,2vw,22px)}
.projects{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;padding-top:28px}
.project-card{min-height:220px;display:grid;place-items:center;padding:24px;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 32px rgb(20 32 58 / 6%)}
a.project-card{transition:transform .2s,box-shadow .2s,border-color .2s}
a.project-card:hover,a.project-card:focus-visible{transform:translateY(-3px);box-shadow:0 16px 40px rgb(20 32 58 / 12%);border-color:#c9b48a}
.project-card img{display:block;width:min(100%,180px);aspect-ratio:1;object-fit:contain}
.project-card img.wide{width:min(100%,220px);aspect-ratio:2/1}
.project-card img.logo-wide{width:min(100%,240px);aspect-ratio:auto;height:auto}
footer{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:58px;padding-top:20px;border-top:1px solid var(--line);font:400 12px var(--mono);color:var(--muted)}
footer a{color:inherit}
@media(max-width:700px){
 .hero{padding:52px 0 30px}
 .projects{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
 .project-card{min-height:180px;padding:18px}
 footer{margin-top:40px}
}
@media(max-width:420px){.projects{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>
<main class="wrap">
  <nav class="topnav" aria-label="Main navigation">
    <a class="brand" href="index.html">Bready Web Studios<span>.</span></a>
    <a href="index.html">&larr; Home</a>
  </nav>

  <header class="hero">
    <div class="eyebrow">Selected work · Website design and development</div>
    <h1>Good work.<br><em>Good people.</em></h1>
    <p class="lede">A selection of businesses and brands I've worked with.</p>
  </header>

  <section class="projects" aria-label="Project logos">
    <a class="project-card" href="https://alwaysbready.me" target="_blank" rel="noopener noreferrer" aria-label="Visit the Always Bready website (opens in a new tab)"><img src="Logo.jpeg" alt="Always Bready"></a>
    <a class="project-card" href="https://www.polybelle.me" target="_blank" rel="noopener noreferrer" aria-label="Visit the Polybelle website (opens in a new tab)"><img class="logo-wide" src="images/clients/polybelle.png" alt="Polybelle Events Hall &amp; Studio"></a>
    <a class="project-card" href="https://arbabkebab.vercel.app/" target="_blank" rel="noopener noreferrer" aria-label="Visit the Arbab Kebab website (opens in a new tab)"><img src="images/clients/arbab-kebab.jpg" alt="Arbab Kebab"></a>
    <a class="project-card" href="https://febys.vercel.app/?preview=febys-preview" target="_blank" rel="noopener noreferrer" aria-label="Visit the Feby's website (opens in a new tab)"><img class="wide" src="images/clients/febys.png" alt="Feby's"></a>
    <a class="project-card" href="https://reecemusic.com" target="_blank" rel="noopener noreferrer" aria-label="Visit the Reece Music website (opens in a new tab)"><img src="images/clients/reece-music.jpg" alt="Reece Music"></a>
    <a class="project-card" href="https://bigmotorsco.vercel.app/" target="_blank" rel="noopener noreferrer" aria-label="Visit the Big Motors Co. website (opens in a new tab)"><img class="wide" src="images/clients/big-motors.png" alt="Big Motors Co."></a>
  </section>

  <footer>
    <span>Bready Web Studios · Dubai, UAE</span>
  </footer>
</main>
</body>
</html>
