<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Selected Projects | Bready Web Studios</title>
<meta name="description" content="Selected projects from Bready Web Studios: Always Bready, Polybelle, Arbab Kebab, Feby's, Reece Music and Big Motors Co..">
<meta name="theme-color" content="#16151a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='6' fill='%2316151a'/%3E%3Ctext x='32' y='42' font-family='Arial,sans-serif' font-weight='800' font-size='28' text-anchor='middle' fill='%23dccdf0'%3EJN%3C/text%3E%3C/svg%3E">
<style>*,*::before,*::after{box-sizing:border-box}html{color-scheme:light dark}body{margin:0;-webkit-font-smoothing:antialiased}img{max-width:100%}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@400;700;900&family=Overpass:wght@400;600;800&family=Overpass+Mono:wght@400;600&display=swap">
<style>
/* Layout: workshop-label system shared with index.html. Palette: black structure, neutral grays, one violet accent with a lavender highlight wash */
:root{
  --bg:#efeff1;--panel:#fafafa;--ink:#16151a;--muted:#55535c;--line:#16151a;--grid:rgba(22,21,26,.26);
  --accent:#4b2380;--onaccent:#ffffff;--hl:#dccdf0;--onhl:#16151a;--tape:#16151a;--tapeink:#efeff1;
  --foot:#16151a;--onfoot:#efeff1;--shadow:#4b2380;
  --display:"Big Shoulders Display",Impact,"Arial Narrow",sans-serif;
  --body:"Overpass","Helvetica Neue",Arial,sans-serif;
  --mono:"Overpass Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121214;--panel:#1b1b1f;--ink:#ececef;--muted:#a3a1ab;--line:#ececef;--grid:rgba(236,236,239,.2);--accent:#b597e6;--onaccent:#121214;--hl:#4a2a82;--onhl:#f3effa;--tape:#ececef;--tapeink:#121214;--foot:#2a292f;--onfoot:#ececef;--shadow:#b597e6;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121214;--panel:#1b1b1f;--ink:#ececef;--muted:#a3a1ab;--line:#ececef;--grid:rgba(236,236,239,.2);--accent:#b597e6;--onaccent:#121214;--hl:#4a2a82;--onhl:#f3effa;--tape:#ececef;--tapeink:#121214;--foot:#2a292f;--onfoot:#ececef;--shadow:#b597e6;color-scheme:dark}
body{background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6}
a{color:var(--ink);text-decoration-thickness:2px;text-underline-offset:3px}
a:focus-visible{outline:3px solid var(--accent);outline-offset:2px;box-shadow:0 0 0 5px var(--bg)}
.eyebrow,.tag{display:inline-block;background:var(--tape);color:var(--tapeink);font:600 11.5px/1.5 var(--mono);text-transform:uppercase;letter-spacing:.13em;padding:2px 8px 1px;border-radius:2px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.25);white-space:normal;justify-self:start}
.topnav{display:flex;justify-content:space-between;align-items:stretch;flex-wrap:wrap;background:var(--panel);border:2px solid var(--line);min-height:54px}
.topnav a{display:flex;align-items:center;padding:0 16px;color:inherit;text-decoration:none;font:800 13.5px/1 var(--body);text-transform:uppercase;letter-spacing:.04em;border-left:1px solid var(--line)}
.topnav a:hover{background:var(--hl);color:var(--onhl)}
.topnav .brand{gap:2px;padding:8px 16px 8px 12px;border-left:0;border-right:2px solid var(--line);font:900 24px/1 var(--display)!important;letter-spacing:.01em}
.topnav .brand:hover{background:none;color:var(--ink)}
.brand .i{font-weight:900;background:var(--hl);color:var(--onhl);padding:1px 5px}
.panel-hero{border:2px solid var(--line);background:var(--panel);padding:32px 30px}
h1,h2,h3{text-wrap:balance}
h1{font:900 clamp(44px,6.4vw,88px)/.92 var(--display);text-transform:uppercase;margin:16px 0 18px}
h1 em,h1 mark{font-style:normal;background:var(--hl);color:var(--onhl);padding:0 .08em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.sitefoot{padding:14px 18px;background:var(--foot);color:var(--onfoot);font:600 12px var(--mono);text-transform:uppercase;letter-spacing:.08em;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sitefoot a{color:inherit}
.wrap{max-width:1200px;margin:0 auto;padding:20px 20px 48px}
.hero{margin-top:22px}
.lede{max-width:56ch;margin:0;color:var(--muted);font-size:18px}
.sec-head{display:flex;align-items:center;gap:14px;margin:34px 0 14px}
.sec-head h2{font:900 clamp(24px,2.6vw,32px)/1 var(--display);text-transform:uppercase;margin:0}
.sec-head .r{flex:1;height:2px;background:var(--line)}
.projects{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
/* logo tiles stay light in dark mode so client logos keep their own backgrounds */
.project-card{min-height:220px;display:grid;place-items:center;padding:24px;background:#fafafa;border:2px solid var(--line);color:#16151a;text-decoration:none}
a.project-card{transition:transform .15s,box-shadow .15s}
a.project-card:hover,a.project-card:focus-visible{transform:translate(-3px,-3px);box-shadow:6px 6px 0 var(--shadow),6px 6px 0 2px var(--line)}
.project-card img{display:block;width:min(100%,180px);aspect-ratio:1;object-fit:contain}
.project-card img.wide{width:min(100%,220px);aspect-ratio:2/1}
.project-card img.logo-wide{width:min(100%,240px);aspect-ratio:auto;height:auto}
.sitefoot{margin-top:32px}
@media(max-width:700px){
 .panel-hero{padding:26px 20px}
 .projects{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
 .project-card{min-height:180px;padding:18px}
}
@media(max-width:420px){.projects{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){a.project-card{transition:none}}
</style>
</head>
<body>
<main class="wrap">
  <nav class="topnav" aria-label="Main navigation">
    <a class="brand" href="index.html"><span class="i">B</span>ready Web Studios</a>
    <a href="index.html">&larr; Home</a>
  </nav>

  <header class="hero panel-hero">
    <div class="eyebrow">Selected work · Website design and development</div>
    <h1>Good work.<br><em>Good people.</em></h1>
    <p class="lede">A selection of businesses and brands I've worked with.</p>
  </header>

  <div class="sec-head"><h2>Client sites</h2><div class="r"></div><span class="eyebrow">6 live</span></div>
  <section class="projects" aria-label="Project logos">
    <a class="project-card" href="https://alwaysbready.me" target="_blank" rel="noopener noreferrer" aria-label="Visit the Always Bready website (opens in a new tab)"><img src="Logo.jpeg" alt="Always Bready"></a>
    <a class="project-card" href="https://www.polybelle.me" target="_blank" rel="noopener noreferrer" aria-label="Visit the Polybelle website (opens in a new tab)"><img class="logo-wide" src="images/clients/polybelle.png" alt="Polybelle Events Hall &amp; Studio"></a>
    <a class="project-card" href="https://arbabkebab.vercel.app/" target="_blank" rel="noopener noreferrer" aria-label="Visit the Arbab Kebab website (opens in a new tab)"><img src="images/clients/arbab-kebab.jpg" alt="Arbab Kebab"></a>
    <a class="project-card" href="https://febys.vercel.app/?preview=febys-preview" target="_blank" rel="noopener noreferrer" aria-label="Visit the Feby's website (opens in a new tab)"><img class="wide" src="images/clients/febys.png" alt="Feby's"></a>
    <a class="project-card" href="https://reecemusic.com" target="_blank" rel="noopener noreferrer" aria-label="Visit the Reece Music website (opens in a new tab)"><img src="images/clients/reece-music.jpg" alt="Reece Music"></a>
    <a class="project-card" href="https://bigmotorsco.vercel.app/" target="_blank" rel="noopener noreferrer" aria-label="Visit the Big Motors Co. website (opens in a new tab)"><img class="wide" src="images/clients/big-motors.png" alt="Big Motors Co."></a>
  </section>

  <footer class="sitefoot">
    <span>Bready Web Studios · Dubai, UAE</span><a href="pricing.html">Pricing</a>
  </footer>
</main>
</body>
</html>
