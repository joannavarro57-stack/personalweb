<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Site Stats</title>
<style>
:root{--bg:#f4f4f2;--surface:#fcfcfb;--border:#e3e2de;--grid:#ecebe7;--text:#0b0b0b;--text2:#52514e;--muted:#8a8984;--series:#2a78d6;--area:rgba(42,120,214,.10)}
@media (prefers-color-scheme:dark){:root{--bg:#111110;--surface:#1a1a19;--border:#2e2e2c;--grid:#262624;--text:#f0efec;--text2:#c3c2b7;--muted:#8d8c85;--series:#3987e5;--area:rgba(57,135,229,.16)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:1100px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--text2);margin:0 0 20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
select,input,button{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:7px 10px}
button{cursor:pointer}button.primary{background:var(--series);border-color:var(--series);color:#fff}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.tile .k{color:var(--text2);font-size:13px}.tile .v{font-size:28px;font-weight:650;margin-top:2px}
.chart{position:relative;margin-bottom:16px}
.chart h2,.tbl h2{font-size:15px;margin:0 0 8px}
svg text{fill:var(--muted);font-size:11px}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 9px;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.12);display:none;white-space:nowrap}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:right;padding:8px 10px;border-bottom:1px solid var(--grid);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--text2);font-weight:600;cursor:pointer;user-select:none}
tr.sel td{background:var(--area)}
tbody tr{cursor:pointer}
#login{max-width:360px;margin:12vh auto}
#login input{width:100%;margin:6px 0 10px}
.err{color:#d03b3b;font-size:13px;min-height:18px}
.hidden{display:none}
</style>
</head>
<body>
<main>
  <section id="login" class="card hidden">
    <h1>Site stats</h1>
    <p class="sub">Sign in to see your visitors.</p>
    <form id="lf">
      <label>Email<input id="em" type="email" required autocomplete="username"></label>
      <label>Password<input id="pw" type="password" required autocomplete="current-password"></label>
      <button class="primary" type="submit">Sign in</button>
      <p class="err" id="lerr"></p>
    </form>
  </section>

  <section id="app" class="hidden">
    <h1>Visitors across your websites</h1>
    <p class="sub">Time counts only while the page is open and on screen.</p>
    <div class="row">
      <select id="range"><option value="7">Last 7 days</option><option value="30" selected>Last 30 days</option><option value="90">Last 90 days</option><option value="365">Last 12 months</option></select>
      <select id="site"><option value="">All sites</option></select>
      <span style="flex:1"></span>
      <button id="out">Sign out</button>
    </div>
    <div class="tiles">
      <div class="card tile"><div class="k">Visitors</div><div class="v" id="t-vis">–</div></div>
      <div class="card tile"><div class="k">Page views</div><div class="v" id="t-views">–</div></div>
      <div class="card tile"><div class="k">Avg time on a page</div><div class="v" id="t-time">–</div></div>
      <div class="card tile"><div class="k">Avg visit length</div><div class="v" id="t-sess">–</div></div>
    </div>
    <div class="card chart"><h2 id="ctitle">Visitors per day, all sites</h2><div id="plot"></div><div class="tip" id="tip"></div></div>
    <div class="card tbl"><h2>By site</h2>
      <table><thead><tr>
        <th data-k="site">Site</th><th data-k="visitors">Visitors</th><th data-k="views">Views</th>
        <th data-k="avg_time_sec">Avg time on page</th><th data-k="avg_session_sec">Avg visit</th><th data-k="last_visit">Last visit</th>
      </tr></thead><tbody id="rows"></tbody></table>
    </div>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = "https://ntohdxudxfggsmhxhvho.supabase.co";
const SUPABASE_KEY = "sb_publishable_81P5_TSD4SuHALFDM4Ao-w_W7C5UkuI";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
let stats = [], daily = [], sortKey = "visitors", sortDir = -1;

const fmtN = n => Number(n || 0).toLocaleString();
function fmtT(sec){ sec = Math.round(sec || 0); if (sec < 60) return sec + "s"; const m = Math.floor(sec/60), s = sec%60; return m < 60 ? m + "m " + s + "s" : Math.floor(m/60) + "h " + (m%60) + "m"; }
function ago(ts){ if(!ts) return "–"; const d=(Date.now()-new Date(ts))/1000; if(d<3600) return Math.max(1,Math.round(d/60))+" min ago"; if(d<86400) return Math.round(d/3600)+" h ago"; return Math.round(d/86400)+" days ago"; }
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function show(){
  const { data:{ session } } = await sb.auth.getSession();
  $("login").classList.toggle("hidden", !!session);
  $("app").classList.toggle("hidden", !session);
  if (session) load();
}
$("lf").onsubmit = async e => {
  e.preventDefault(); $("lerr").textContent = "";
  const { error } = await sb.auth.signInWithPassword({ email:$("em").value, password:$("pw").value });
  if (error) $("lerr").textContent = error.message; else show();
};
$("out").onclick = async () => { await sb.auth.signOut(); show(); };
$("range").onchange = load;
$("site").onchange = render;

async function load(){
  const days = +$("range").value;
  const [a, b] = await Promise.all([ sb.rpc("site_stats", { p_days: days }), sb.rpc("site_daily", { p_days: days }) ]);
  if (a.error || b.error) { $("rows").innerHTML = `<tr><td colspan="6">${esc((a.error||b.error).message)}</td></tr>`; return; }
  stats = a.data || []; daily = b.data || [];
  const cur = $("site").value;
  $("site").innerHTML = '<option value="">All sites</option>' + stats.map(s => `<option${s.site===cur?" selected":""}>${esc(s.site)}</option>`).join("");
  render();
}

function render(){
  const site = $("site").value;
  const pick = site ? stats.filter(s => s.site === site) : stats;
  const views = pick.reduce((t,s)=>t+ +s.views,0);
  const sessions = pick.reduce((t,s)=>t+ +s.sessions,0);
  // visitors summed per site (a person visiting two sites counts twice)
  $("t-vis").textContent = fmtN(pick.reduce((t,s)=>t+ +s.visitors,0));
  $("t-views").textContent = fmtN(views);
  $("t-time").textContent = views ? fmtT(pick.reduce((t,s)=>t+s.avg_time_sec*s.views,0)/views) : "–";
  $("t-sess").textContent = sessions ? fmtT(pick.reduce((t,s)=>t+(s.avg_session_sec||0)*s.sessions,0)/sessions) : "–";

  const rows = [...stats].sort((x,y)=>{ let a=x[sortKey], b=y[sortKey]; if(sortKey!=="site"&&sortKey!=="last_visit"){a=+a;b=+b;} return (a>b?1:a<b?-1:0)*sortDir; });
  $("rows").innerHTML = rows.length ? rows.map(s => `<tr data-s="${esc(s.site)}" class="${s.site===site?"sel":""}">
    <td>${esc(s.site)}</td><td>${fmtN(s.visitors)}</td><td>${fmtN(s.views)}</td>
    <td>${fmtT(s.avg_time_sec)}</td><td>${fmtT(s.avg_session_sec)}</td><td>${ago(s.last_visit)}</td></tr>`).join("")
    : `<tr><td colspan="6" style="text-align:left;color:var(--text2)">No visits yet in this period.</td></tr>`;
  document.querySelectorAll("#rows tr[data-s]").forEach(tr => tr.onclick = () => { $("site").value = $("site").value===tr.dataset.s ? "" : tr.dataset.s; render(); });

  $("ctitle").textContent = "Visitors per day, " + (site || "all sites");
  const days = +$("range").value, byDay = new Map();
  for (const d of daily) if (!site || d.site === site) byDay.set(d.day, (byDay.get(d.day)||0) + +d.visitors);
  const pts = [];
  for (let i = days-1; i >= 0; i--) { const dt = new Date(Date.now() - i*864e5); const k = dt.toISOString().slice(0,10); pts.push({ k, dt, v: byDay.get(k)||0 }); }
  drawLine(pts);
}

document.querySelectorAll("th[data-k]").forEach(th => th.onclick = () => { const k = th.dataset.k; sortDir = sortKey===k ? -sortDir : (k==="site"?1:-1); sortKey = k; render(); });

function drawLine(pts){
  const el = $("plot"), W = el.clientWidth || 600, H = 220, m = {l:36,r:10,t:10,b:24};
  const max = Math.max(4, ...pts.map(p=>p.v)), step = Math.pow(10, Math.floor(Math.log10(max))), top = Math.ceil(max/step)*step;
  const x = i => m.l + (pts.length<2 ? 0 : i*(W-m.l-m.r)/(pts.length-1)), y = v => m.t + (H-m.t-m.b)*(1-v/top);
  let g = "";
  for (let i=0;i<=4;i++){ const v = top*i/4, yy = y(v); g += `<line x1="${m.l}" x2="${W-m.r}" y1="${yy}" y2="${yy}" stroke="var(--grid)"/><text x="${m.l-6}" y="${yy+4}" text-anchor="end">${fmtN(Math.round(v))}</text>`; }
  const every = Math.ceil(pts.length/6);
  pts.forEach((p,i)=>{ if(i%every===0) g += `<text x="${x(i)}" y="${H-6}" text-anchor="middle">${p.dt.toLocaleDateString(undefined,{month:"short",day:"numeric"})}</text>`; });
  const line = pts.map((p,i)=>`${i?"L":"M"}${x(i)},${y(p.v)}`).join("");
  const area = line + `L${x(pts.length-1)},${y(0)}L${x(0)},${y(0)}Z`;
  el.innerHTML = `<svg width="${W}" height="${H}" role="img" aria-label="Visitors per day">${g}
    <path d="${area}" fill="var(--area)"/><path d="${line}" fill="none" stroke="var(--series)" stroke-width="2" stroke-linejoin="round"/>
    <line id="xh" y1="${m.t}" y2="${H-m.b}" stroke="var(--muted)" stroke-dasharray="3 3" visibility="hidden"/>
    <circle id="dot" r="4" fill="var(--series)" stroke="var(--surface)" stroke-width="2" visibility="hidden"/>
    <rect x="${m.l}" y="0" width="${W-m.l-m.r}" height="${H}" fill="transparent" id="hit"/></svg>`;
  const tip = $("tip"), hit = el.querySelector("#hit"), xh = el.querySelector("#xh"), dot = el.querySelector("#dot");
  hit.onmousemove = e => {
    const r = el.getBoundingClientRect(), mx = e.clientX - r.left;
    const i = Math.max(0, Math.min(pts.length-1, Math.round((mx-m.l)/((W-m.l-m.r)/Math.max(1,pts.length-1)))));
    const p = pts[i];
    xh.setAttribute("x1",x(i)); xh.setAttribute("x2",x(i)); xh.setAttribute("visibility","visible");
    dot.setAttribute("cx",x(i)); dot.setAttribute("cy",y(p.v)); dot.setAttribute("visibility","visible");
    tip.innerHTML = `<b>${fmtN(p.v)}</b> visitor${p.v===1?"":"s"}<br><span style="color:var(--text2)">${p.dt.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"})}</span>`;
    tip.style.display = "block";
    tip.style.left = Math.min(x(i)+28, W-tip.offsetWidth) + "px"; tip.style.top = (y(p.v)+20) + "px";
  };
  hit.onmouseleave = () => { tip.style.display="none"; xh.setAttribute("visibility","hidden"); dot.setAttribute("visibility","hidden"); };
}
addEventListener("resize", () => { if (stats.length || daily.length) render(); });
sb.auth.onAuthStateChange(() => {});
show();
</script>
</body>
</html>
